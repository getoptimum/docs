name = "docs"
compatibility_date = "2025-12-01"

[assets]
directory = ".vitepress/dist"
not_found_handling = "404-page"

# The public hostname, declared here so the deploy owns it rather than a
# dashboard click. Cloudflare creates the DNS record and the certificate as part
# of `wrangler deploy`; attaching the domain on its own leaves a binding with no
# record published, which is what took docs.getoptimum.xyz down on 2026-10-20.
#
# Adding this requires the hostname to have no other DNS record: Cloudflare
# refuses to overwrite an externally managed one (error 100117), so the old
# Vercel CNAME had to be deleted first.
[[routes]]
pattern = "docs.getoptimum.xyz"
custom_domain = true
