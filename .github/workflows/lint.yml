name: Lint Site

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - release/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-lint
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Lint
        run: make lint

      - name: Lint markdown
        run: make lint-markdown

      # vercel.json serves production and public/_redirects serves the
      # Cloudflare preview; neither platform reads the other's file, so a rule
      # added to one and not the other is a link that works where it was tested
      # and 404s where it ships.
      - name: Check redirect parity
        run: make check-redirects
