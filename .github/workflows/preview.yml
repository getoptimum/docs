name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# One preview per PR. A newer push replaces the in-flight upload.
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: Deploy PR preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Upload preview version
        id: preview
        env:
          # Same account as the console deploys. The token is the repo secret,
          # not committed. Version URLs are public, so the comment is shareable.
          CLOUDFLARE_ACCOUNT_ID: 989471e794851c448afa100bdc8768cc
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          yarn build
          # Alias stays put across pushes: pr-57-docs.<account>.workers.dev
          ALIAS="pr-${{ github.event.pull_request.number }}"
          npx wrangler versions upload --preview-alias "$ALIAS" 2>&1 | tee upload.log
          URL=$(grep -oiE "https://${ALIAS}-[a-z0-9.-]+\.workers\.dev" upload.log | tail -1)
          if [ -z "$URL" ]; then
            URL=$(grep -oiE 'https://[a-z0-9.-]+\.workers\.dev' upload.log | tail -1)
          fi
          if [ -z "$URL" ]; then
            echo "wrangler did not print a preview URL" >&2
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: cf-preview
          message: |
            Cloudflare preview deployment is ready.

            **Preview URL:** ${{ steps.preview.outputs.url }}

            Refreshed on every push to this PR. This URL is public.
